name: Release
on:
  workflow_dispatch:
    inputs:
      btop_version:
        description: "btop version (e.g. 1.4.7) — empty = latest upstream"
        required: false
        default: ""
permissions:
  contents: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target btop version
        id: btop
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.btop_version }}
        run: |
          V="$INPUT_VERSION"
          if [ -z "$V" ]; then
            V="$(gh api repos/aristocratos/btop/releases/latest --jq .tag_name)"
            V="${V#v}"
          fi
          # Strict allowlist: reject anything that is not a plain version tag
          # (defends against shell injection via a malicious upstream tag name)
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9]+)*$ ]]; then
            echo "::error::rejecting suspicious btop version: $V"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Compute plugin version (UTC date + suffix on collision)
        id: plg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="$(date -u +%Y.%m.%d)"
          VER="$BASE"
          for s in a b c d e f; do
            gh release view "$VER" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || break
            VER="$BASE$s"
          done
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          php tests/php/run_tests.php
          bash scripts/test_php_syntax.sh

      - name: Build package
        env:
          BTOP_VERSION_TARGET: ${{ steps.btop.outputs.version }}
          PLUGIN_VERSION: ${{ steps.plg.outputs.version }}
        run: bash scripts/build.sh "$BTOP_VERSION_TARGET" "$PLUGIN_VERSION"

      - name: Smoke test the binary
        env:
          BTOP_VERSION_TARGET: ${{ steps.btop.outputs.version }}
        run: |
          OUT="$(dist/pkgroot/usr/bin/btop --version)"
          echo "$OUT"
          echo "$OUT" | grep -F "$BTOP_VERSION_TARGET"

      - name: Create GitHub release (artifacts first, plg bump after)
        env:
          GH_TOKEN: ${{ github.token }}
          BTOP_VERSION_TARGET: ${{ steps.btop.outputs.version }}
          PLUGIN_VERSION: ${{ steps.plg.outputs.version }}
        run: |
          NOTES="$(printf 'Packages btop v%s.\nUpstream artifact SHA256: %s' "$BTOP_VERSION_TARGET" "$(cat dist/btop-*.sha256)")"
          gh release create "$PLUGIN_VERSION" \
            dist/unraid.btop-*.txz dist/unraid.btop-*.md5 \
            -t "$PLUGIN_VERSION (btop v$BTOP_VERSION_TARGET)" \
            -n "$NOTES"

      - name: Bump btop.plg and BTOP_VERSION
        env:
          BTOP_VERSION_TARGET: ${{ steps.btop.outputs.version }}
          PLUGIN_VERSION: ${{ steps.plg.outputs.version }}
        run: |
          MD5="$(awk '{print $1}' dist/unraid.btop-*.md5)"
          sed -i -E "s|(<!ENTITY version +\").*(\">)|\1${PLUGIN_VERSION}\2|" btop.plg
          sed -i -E "s|(<!ENTITY md5 +\").*(\">)|\1${MD5}\2|" btop.plg
          awk -v entry="###${PLUGIN_VERSION}\n- Update btop to v${BTOP_VERSION_TARGET}" \
            '{print} /^<CHANGES>$/{print entry}' btop.plg > btop.plg.new
          mv btop.plg.new btop.plg
          xmllint --noout --noent btop.plg
          echo "$BTOP_VERSION_TARGET" > BTOP_VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btop.plg BTOP_VERSION
          git commit -m "release: ${PLUGIN_VERSION} (btop v${BTOP_VERSION_TARGET}) [skip ci]"
          git push
